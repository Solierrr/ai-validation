sonar.projectKey=Solierrr_ai-validation
sonar.organization=solierrr
sonar.python.version=3.14.2

# Código de produção x código de teste.
# Separar os dois evita que o Sonar cobre métricas de duplicação/complexidade
# dos testes e permite calcular a cobertura corretamente.
sonar.sources=src
sonar.tests=tests

# Relatório de cobertura gerado pelo pytest-cov (ver pytest.ini)
sonar.python.coverage.reportPaths=coverage.xml

# Encoding do código-fonte
sonar.sourceEncoding=UTF-8

# Arquivos irrelevantes para a análise
sonar.exclusions=**/__pycache__/**,docs/**
