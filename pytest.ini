[pytest]
# Diretório onde ficam os testes
testpaths = tests

# Padrões de descoberta de testes
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# asyncio_mode=auto permite testar funções async sem decorator em cada teste
asyncio_mode = auto

# Cobertura de código: gera coverage.xml para o SonarQube consumir no CI
addopts =
    --cov=src
    --cov-report=term-missing
    --cov-report=xml:coverage.xml

# Silencia warnings de libs externas que poluem a saída
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
